<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>자기주도학습 체크리스트</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 열 노트 형태. 위에서 아래로 주간 진행 → 전체 현황 → 요일 탭 → 오늘 체크리스트 → 모르는 부분 기록.
   과목마다 고유 색(수학 파랑, 과학 초록, 국어 분홍, 영어 황색)을 쓰고 나머지는 먹색으로 통일한다. */
:root {
  color-scheme: light;
  --bg: #eef1f4;
  --surface: #fafbfc;
  --ink: #17212b;
  --ink-2: #55626f;
  --line: #d5dbe2;
  --accent: #17212b;
  --on-accent: #fafbfc;
  --focus: #2a62d6;
  --danger: #b3362b;
  --warn-bg: #fff4d6;
  --warn-ink: #5e4300;
  --math: #2a62d6;
  --sci: #17784d;
  --ko: #c4365f;
  --en: #8f5a05;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a;
    --surface: #171e26;
    --ink: #e7ecf1;
    --ink-2: #9aa7b4;
    --line: #2a343f;
    --accent: #e7ecf1;
    --on-accent: #0f141a;
    --focus: #7aa5ff;
    --danger: #ff8a7d;
    --warn-bg: #3a2f10;
    --warn-ink: #f6dfa0;
    --math: #6b9bff;
    --sci: #4cc48c;
    --ko: #ff7c9f;
    --en: #f0b24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a;
  --surface: #171e26;
  --ink: #e7ecf1;
  --ink-2: #9aa7b4;
  --line: #2a343f;
  --accent: #e7ecf1;
  --on-accent: #0f141a;
  --focus: #7aa5ff;
  --danger: #ff8a7d;
  --warn-bg: #3a2f10;
  --warn-ink: #f6dfa0;
  --math: #6b9bff;
  --sci: #4cc48c;
  --ko: #ff7c9f;
  --en: #f0b24a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 760px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 40px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }

/* 상단 */
.top { display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; text-wrap: balance; }
.period { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.modenote { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.weekrow { display: flex; align-items: center; gap: 8px; }
.weekinfo { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.weeklabel { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.weekcount { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.icon { width: 44px; height: 44px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.icon:hover:not(:disabled) { border-color: var(--ink-2); }
.icon:disabled { opacity: .35; cursor: default; }
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.link { align-self: flex-start; background: none; border: 0; padding: 6px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* 전체 현황 */
.overall { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.overall > summary { min-height: 48px; display: flex; align-items: center; gap: 10px; padding-inline: 14px; font-weight: 600; cursor: pointer; list-style-position: inside; }
.overall > summary .sum-total { margin-left: auto; color: var(--ink-2); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
.owk { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 6px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 14px; min-height: 56px; }
.owk:hover { background: var(--bg); }
.owk[aria-current="true"] { background: var(--bg); }
.owk .ow-name { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.owk .ow-name small { font-weight: 400; color: var(--ink-2); margin-left: 6px; font-size: 12px; }
.owk .ow-stat { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.owk .ow-bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.owk .ow-bar i { display: block; height: 100%; background: var(--accent); }

/* 요일 탭 */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.tab { min-height: 66px; padding: 6px 2px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tab .dn { font-weight: 600; font-size: 15px; }
.tab .dd { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tab.today .dd { border: 1.5px solid currentColor; color: var(--ink); font-weight: 600; }
.tab .dc { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tab.complete .dc { color: var(--sci); font-weight: 600; }
.tab[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tab[aria-current="true"] .dd, .tab[aria-current="true"] .dc, .tab[aria-current="true"].complete .dc { color: var(--on-accent); }
.tab[aria-current="true"].today .dd { color: var(--on-accent); }

/* 오늘 체크리스트 */
.dayhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.3; }
.badge { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
.daycount { margin-left: auto; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.alldone { color: var(--sci); font-weight: 600; margin-top: 6px; }
.group { margin-top: 18px; }
.grouphead { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--c); font-size: 14px; }
.grouphead .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.grouphead .gc { margin-left: auto; color: var(--ink-2); font-weight: 400; font-variant-numeric: tabular-nums; }
.items { list-style: none; margin: 6px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.item { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; padding-inline: 14px 10px; }
.item + .item { border-top: 1px solid var(--line); }
.check { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 56px; cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { flex: none; width: 26px; height: 26px; border: 2px solid var(--c); border-radius: 7px; position: relative; background: transparent; }
.check input:checked + .box { background: var(--c); }
.check input:checked + .box::after { content: ""; position: absolute; left: 7px; top: 2px; width: 7px; height: 13px; border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.check input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
.itext { min-width: 0; display: flex; flex-direction: column; }
.ititle { font-weight: 500; overflow-wrap: anywhere; }
.ihint { color: var(--ink-2); font-size: 13px; }
.item.done .ititle { text-decoration: line-through; color: var(--ink-2); }
.iact { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 8px; }
.skip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.skip input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink-2); }
.item.skipped .skip { background: var(--ink-2); border-color: var(--ink-2); color: var(--bg); font-weight: 600; }
.item.skipped .skip input { accent-color: var(--bg); }
.item.skipped .ititle { color: var(--ink-2); }
.ask { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; color: var(--ink-2); }
.ask:hover { color: var(--ink); border-color: var(--ink-2); }
.s-math { --c: var(--math); }
.s-sci { --c: var(--sci); }
.s-ko { --c: var(--ko); }
.s-en { --c: var(--en); }

/* 기록 */
.log { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
.lede { color: var(--ink-2); margin-top: 4px; }
form { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, legend { font-size: 13px; font-weight: 600; color: var(--ink-2); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; }
select, input[type="text"], textarea { width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
textarea { resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.formfoot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.primary { min-height: 46px; padding: 10px 22px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.hint { color: var(--ink-2); font-size: 13px; }
.msg { color: var(--danger); font-size: 13px; }

.logbar { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.notes { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--ink-2); padding: 18px 4px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.ntag { color: var(--c); font-weight: 600; }
.nwhen { color: var(--ink-2); }
.nsrc { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.nsrc span { border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; font-size: 12px; }
.nq { font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }
.nmeta { color: var(--ink-2); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.nmeta b { font-weight: 600; color: var(--ink); }
.nact { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.solved { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; font-size: 14px; }
.solved input { width: 20px; height: 20px; accent-color: var(--sci); }
.del { border: 0; background: none; color: var(--ink-2); font-size: 13px; min-height: 40px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }
.del.armed { color: var(--danger); font-weight: 600; }
.note.isdone .nq { color: var(--ink-2); }

/* 주소 키가 없을 때 */
.gate { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 18px; display: flex; flex-direction: column; gap: 8px; }
.gate p { color: var(--ink-2); }

footer { margin-top: 28px; color: var(--ink-2); font-size: 13px; }
footer .err { color: var(--danger); }

@media (min-width: 560px) {
  .wrap { padding-block: 32px 56px; }
  .tab { min-height: 72px; }
}
@media (prefers-reduced-motion: reduce) {
  .fill { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>자기주도학습 체크리스트</h1>
    <p class="period" id="period"></p>
    <p class="modenote" id="modeNote" hidden></p>
  </header>

  <section id="gate" class="gate" hidden>
    <h2>주소를 다시 확인해 주세요</h2>
    <p>이 페이지는 부모님께 받은 전체 주소로만 열려요. 주소 끝의 # 뒤 글자까지 함께 열어 주세요.</p>
  </section>

  <div id="app">
    <div class="weekrow" style="margin-top:12px">
      <button id="prevWeek" class="icon" type="button" aria-label="이전 주">‹</button>
      <div class="weekinfo">
        <span id="weekLabel" class="weeklabel"></span>
        <span id="weekCount" class="weekcount"></span>
      </div>
      <button id="nextWeek" class="icon" type="button" aria-label="다음 주">›</button>
    </div>
    <div class="track" id="weekTrack" role="progressbar" aria-label="이번 주 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="margin-top:12px"><div id="weekFill" class="fill"></div></div>
    <button id="thisWeek" class="link" type="button" hidden>이번 주로 돌아가기</button>

    <details class="overall" id="overall">
      <summary><span>전체 현황</span><span class="sum-total" id="sumTotal"></span></summary>
      <div id="overallList"></div>
    </details>

    <nav id="tabs" class="tabs" aria-label="요일 선택"></nav>

    <main>
      <section aria-labelledby="dayTitle">
        <div class="dayhead">
          <h2 id="dayTitle"></h2>
          <span id="todayBadge" class="badge" hidden>오늘</span>
          <span id="dayCount" class="daycount"></span>
        </div>
        <p id="allDone" class="alldone" hidden></p>
        <div id="groups"></div>
      </section>

      <section id="log" class="log" aria-labelledby="logTitle">
        <h2 id="logTitle">모르는 부분 기록</h2>
        <p class="lede">공부하다 막힌 곳을 어디에서 찾아봤는지 적어 두세요.</p>

        <form id="noteForm" novalidate>
          <div class="two">
            <label class="field"><span>과목</span><select id="nSubject"></select></label>
            <label class="field"><span>파트</span><select id="nPart"></select></label>
          </div>
          <fieldset>
            <legend>찾아본 곳 (여러 개 선택 가능)</legend>
            <div id="nSources" class="chips"></div>
          </fieldset>
          <label class="field"><span>모르는 내용</span><textarea id="nQuestion" rows="3" placeholder="어떤 부분이 이해되지 않았나요?"></textarea></label>
          <label class="field"><span>강의 제목 · 검색어</span><input id="nQuery" type="text" autocomplete="off" placeholder="유튜브 채널과 강의 제목, EBS 강의명, AI에 물어본 질문"></label>
          <label class="field"><span>알게 된 내용</span><textarea id="nAnswer" rows="2" placeholder="찾아보고 이해한 점 (아직이면 비워 두세요)"></textarea></label>
          <div class="formfoot">
            <button class="primary" type="submit">기록 추가</button>
            <span id="nDayHint" class="hint"></span>
            <span id="nMsg" class="msg" role="alert"></span>
          </div>
        </form>

        <div class="logbar">
          <div class="seg" role="group" aria-label="기록 보기 범위">
            <button id="fDay" type="button" aria-pressed="true"></button>
            <button id="fWeek" type="button" aria-pressed="false"></button>
          </div>
        </div>
        <ul id="notes" class="notes"></ul>
      </section>
    </main>
  </div>

  <footer><span id="saveStatus" aria-live="polite"></span></footer>
</div>

<noscript><p style="padding:16px">이 페이지는 JavaScript가 켜져 있어야 동작해요.</p></noscript>

<script type="module">
import { firebaseConfig } from './firebase-config.js';

document.documentElement.lang = 'ko';

/* ---------- 학습 계획 ---------- */
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SUBJ = { math: '수학', sci: '과학', ko: '국어', en: '영어' };
const ORDER = ['math', 'sci', 'ko', 'en'];
const PARTS = {
  math: ['학원 수업', '기타'],
  sci: ['학원 수업', '기타'],
  ko: ['어휘', '문법', '문학', '비문학', '기타'],
  en: ['단어', '문법·구문·독해', '기타']
};
const SOURCES = ['유튜브 강의', 'EBS 강의', 'AI 검색', '기타'];
const ITEMS = {
  math: { s: 'math', part: '학원 수업', title: '수학 학원 출석', hint: '학원에 다녀왔으면 체크' },
  sci: { s: 'sci', part: '학원 수업', title: '과학 학원 출석', hint: '학원에 다녀왔으면 체크' },
  kov: { s: 'ko', part: '어휘', title: '국어 어휘', hint: '매일' },
  kog: { s: 'ko', part: '문법', title: '국어 문법', hint: '금요일' },
  kol: { s: 'ko', part: '문학', title: '국어 문학', hint: '금요일' },
  kon: { s: 'ko', part: '비문학', title: '국어 비문학', hint: '일요일' },
  env: { s: 'en', part: '단어', title: '영어 단어', hint: '매일' },
  eng: { s: 'en', part: '문법·구문·독해', title: '영어 문법 · 구문 · 독해', hint: '일요일' }
};
const SCHEDULE = [
  ['math', 'kov', 'env'],          // 월
  ['sci', 'kov', 'env'],           // 화
  ['math', 'kov', 'env'],          // 수
  ['math', 'kov', 'env'],          // 목
  ['kov', 'kog', 'kol', 'env'],    // 금
  ['math', 'kov', 'env'],          // 토
  ['kov', 'kon', 'env', 'eng']     // 일
];
const WEEK_TOTAL = SCHEDULE.reduce((a, d) => a + d.length, 0);

/* ---------- 기간: 2026-11-23(월) ~ 2027-02-28(일), 14주 ---------- */
const START = new Date(2026, 10, 23);
const WEEKS = 14;

/* ---------- 날짜 ---------- */
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const md = (d) => (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
const ymd = (d) => d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
const weekStartOf = (i) => addDays(START, i * 7);
const dayOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

const today = dayOnly(new Date());
const daysSinceStart = Math.floor((today - START) / 86400000);
const todayWeek = Math.floor(daysSinceStart / 7);            // 범위 밖이면 음수 또는 WEEKS 이상
const todayInRange = todayWeek >= 0 && todayWeek < WEEKS;
const todayIdx = ((today.getDay() + 6) % 7);
const startWeek = Math.min(Math.max(todayWeek, 0), WEEKS - 1);

/* ---------- 데이터 ---------- */
const DEL = Symbol('del');
const emptyData = () => ({ checks: {}, skips: {}, notes: {}, updatedAt: 0 });
function normalize(o) {
  o = o || {};
  const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  return { checks: obj(o.checks), skips: obj(o.skips), notes: obj(o.notes), updatedAt: Number(o.updatedAt) || 0 };
}
function applyPatch(d, p) {
  for (const sec of ['checks', 'skips', 'notes']) {
    const part = p[sec];
    if (!part) continue;
    for (const k of Object.keys(part)) {
      const v = part[k];
      if (v === DEL) delete d[sec][k];
      else if (sec === 'notes') d.notes[k] = Object.assign({}, d.notes[k] || {}, v);
      else d[sec][k] = v;
    }
  }
}

const state = { week: startWeek, day: (todayInRange && todayWeek === startWeek) ? todayIdx : 0, filter: 'day', sources: {} };
let allWeeks = {};          // 'YYYY-MM-DD' -> data
let backend = null;         // { mode, start(onData), write(weekKey, patch) }

const wkey = () => keyOf(weekStartOf(state.week));
const cur = () => allWeeks[wkey()] || emptyData();
const isTodayWeek = () => todayInRange && state.week === todayWeek;

/* ---------- 주소의 비밀 키 ---------- */
function readKey() {
  const re = /^[A-Za-z0-9_-]{20,}$/;
  const m = /(?:^#|&)k=([A-Za-z0-9_-]{20,})/.exec(location.hash);
  let key = m ? m[1] : null;
  if (key) {
    try {
      localStorage.setItem('sdl2:key', key);
      if (localStorage.getItem('sdl2:key') === key) history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {}
    return key;
  }
  try { key = localStorage.getItem('sdl2:key'); } catch (e) { key = null; }
  return (key && re.test(key)) ? key : null;
}

/* ---------- 저장소: 로컬(설정 전) ---------- */
function makeLocalBackend() {
  const prefix = 'sdl2:w:';
  return {
    mode: 'local',
    start(onData) {
      const all = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(prefix) === 0) all[k.slice(prefix.length)] = normalize(JSON.parse(localStorage.getItem(k)));
        }
      } catch (e) {}
      onData(all, { pending: false, local: true });
    },
    write(weekKey) {
      let ok = true;
      try { localStorage.setItem(prefix + weekKey, JSON.stringify(allWeeks[weekKey])); } catch (e) { ok = false; }
      setStatus(ok ? 'local' : 'localfail');
    }
  };
}

/* ---------- 저장소: Firebase(Firestore) ---------- */
async function makeCloudBackend(key) {
  const BASE = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [appMod, fs] = await Promise.all([import(BASE + 'firebase-app.js'), import(BASE + 'firebase-firestore.js')]);
  const app = appMod.initializeApp(firebaseConfig);
  let db;
  try {
    db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  } catch (e) {
    db = fs.getFirestore(app);
  }
  const col = fs.collection(db, 'checklists', key, 'weeks');
  const toCloud = (patch) => {
    const out = { updatedAt: Date.now() };
    for (const sec of ['checks', 'skips', 'notes']) {
      if (!patch[sec]) continue;
      out[sec] = {};
      for (const k of Object.keys(patch[sec])) {
        const v = patch[sec][k];
        if (v === DEL) out[sec][k] = fs.deleteField();
        else out[sec][k] = v;
      }
    }
    return out;
  };
  return {
    mode: 'cloud',
    start(onData, onError) {
      fs.onSnapshot(col, (snap) => {
        const all = {};
        snap.docs.forEach((d) => { all[d.id] = normalize(d.data()); });
        onData(all, { pending: snap.metadata.hasPendingWrites, fromCache: snap.metadata.fromCache });
      }, (err) => onError(err));
    },
    write(weekKey, patch) {
      setStatus('saving');
      fs.setDoc(fs.doc(col, weekKey), toCloud(patch), { merge: true }).catch((err) => {
        setStatus('error', err && err.code ? err.code : String(err));
      });
    }
  };
}

/* ---------- 상태 표시 ---------- */
function setStatus(kind, detail) {
  const el = document.getElementById('saveStatus');
  el.className = '';
  const map = {
    cloud: '저장됨 · 부모님 화면에도 바로 반영돼요',
    saving: '저장 중…',
    offline: '인터넷이 끊겼어요. 연결되면 자동으로 저장돼요',
    local: '저장됨 · 이 기기에만 보관돼요 (Firebase 설정 전)',
    localfail: '저장할 수 없어요. 시크릿 모드이거나 브라우저가 저장을 막고 있어요.'
  };
  if (kind === 'error') {
    el.className = 'err';
    el.textContent = '저장하지 못했어요 (' + (detail || '알 수 없는 오류') + '). 보안 규칙과 설정을 확인해 주세요.';
    return;
  }
  el.textContent = map[kind] || '';
}

/* ---------- 변경 적용 ---------- */
function commit(patch) {
  const k = wkey();
  if (!allWeeks[k]) allWeeks[k] = emptyData();
  applyPatch(allWeeks[k], patch);
  allWeeks[k].updatedAt = Date.now();
  backend.write(k, patch);
}

/* ---------- DOM 도우미 ---------- */
function h(tag, props) {
  const e = document.createElement(tag);
  props = props || {};
  for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]);
    for (const c of kids) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(c));
    }
  }
  return e;
}
const $ = (id) => document.getElementById(id);

const countDay = (d, i, sec) => SCHEDULE[i].filter((id) => d[sec][i + '_' + id]).length;
const countWeek = (d, sec) => { let n = 0; for (let i = 0; i < 7; i++) n += countDay(d, i, sec); return n; };

/* ---------- 렌더 ---------- */
function renderWeek() {
  const start = weekStartOf(state.week);
  $('weekLabel').textContent = (state.week + 1) + '주차 · ' + md(start) + ' – ' + md(addDays(start, 6));
  const d = cur();
  const done = countWeek(d, 'checks'), sk = countWeek(d, 'skips');
  const pct = Math.round(done / WEEK_TOTAL * 100);
  $('weekCount').textContent = '완료 ' + done + ' / ' + WEEK_TOTAL + (sk ? ' · 안 함 ' + sk : '');
  $('weekFill').style.width = pct + '%';
  $('weekTrack').setAttribute('aria-valuenow', String(pct));
  $('prevWeek').disabled = state.week <= 0;
  $('nextWeek').disabled = state.week >= WEEKS - 1;
  $('thisWeek').hidden = state.week === startWeek;
}

function renderOverall() {
  const box = $('overallList');
  box.textContent = '';
  let tDone = 0, tSkip = 0, tNotes = 0, tTotal = 0;
  for (let i = 0; i < WEEKS; i++) {
    const start = weekStartOf(i), end = addDays(start, 6);
    const d = allWeeks[keyOf(start)] || emptyData();
    const done = countWeek(d, 'checks'), sk = countWeek(d, 'skips'), nn = Object.keys(d.notes).length;
    tDone += done; tSkip += sk; tNotes += nn; tTotal += WEEK_TOTAL;
    const past = end < today;
    const miss = past ? Math.max(WEEK_TOTAL - done - sk, 0) : 0;
    const stat = '완료 ' + done + '/' + WEEK_TOTAL + (sk ? ' · 안 함 ' + sk : '') + (miss ? ' · 미체크 ' + miss : '') + (nn ? ' · 기록 ' + nn : '');
    box.append(h('button', {
      type: 'button', class: 'owk', 'aria-current': i === state.week ? 'true' : 'false',
      'aria-label': (i + 1) + '주차 ' + md(start) + '부터 ' + md(end) + ', ' + stat,
      onclick: () => { state.week = i; state.day = (todayInRange && i === todayWeek) ? todayIdx : 0; $('overall').open = false; renderAll(); window.scrollTo(0, 0); }
    },
      h('span', { class: 'ow-name' }, (i + 1) + '주차', h('small', null, md(start) + ' – ' + md(end))),
      h('span', { class: 'ow-stat' }, stat),
      h('span', { class: 'ow-bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + Math.round(done / WEEK_TOTAL * 100) + '%' }))
    ));
  }
  $('sumTotal').textContent = '완료 ' + tDone + '/' + tTotal + (tSkip ? ' · 안 함 ' + tSkip : '') + (tNotes ? ' · 기록 ' + tNotes : '');
}

function renderTabs() {
  const nav = $('tabs');
  nav.textContent = '';
  const d = cur(), start = weekStartOf(state.week);
  for (let i = 0; i < 7; i++) {
    const date = addDays(start, i);
    const done = countDay(d, i, 'checks'), total = SCHEDULE[i].length, sk = countDay(d, i, 'skips');
    const isToday = isTodayWeek() && i === todayIdx;
    const cls = 'tab' + (isToday ? ' today' : '') + (done === total ? ' complete' : '');
    nav.append(h('button', {
      type: 'button', class: cls,
      'aria-current': i === state.day ? 'true' : 'false',
      'aria-label': DAYS[i] + '요일 ' + md(date) + ', ' + done + '/' + total + ' 완료' + (sk ? ', 안 함 ' + sk : '') + (isToday ? ', 오늘' : ''),
      onclick: () => { state.day = i; renderAll(); }
    },
      h('span', { class: 'dn' }, DAYS[i]),
      h('span', { class: 'dd' }, String(date.getDate())),
      h('span', { class: 'dc' }, done + '/' + total + (sk ? ' ·안' + sk : ''))
    ));
  }
}

function renderDay(focusKey, focusSkipKey) {
  const i = state.day, date = addDays(weekStartOf(state.week), i), d = cur();
  $('dayTitle').textContent = DAYS[i] + '요일 · ' + md(date);
  $('todayBadge').hidden = !(isTodayWeek() && i === todayIdx);
  const done = countDay(d, i, 'checks'), total = SCHEDULE[i].length, skn = countDay(d, i, 'skips');
  $('dayCount').textContent = done + ' / ' + total;
  const al = $('allDone');
  al.hidden = (done + skn) !== total;
  al.textContent = skn ? ('이 날 항목을 모두 기록했어요. (안 함 ' + skn + '개)') : '이 날 할 일을 모두 마쳤어요.';

  const wrap = $('groups');
  wrap.textContent = '';
  ORDER.forEach((s) => {
    const ids = SCHEDULE[i].filter((id) => ITEMS[id].s === s);
    if (!ids.length) return;
    const gd = ids.filter((id) => d.checks[i + '_' + id]).length;
    const ul = h('ul', { class: 'items' });
    ids.forEach((id) => {
      const it = ITEMS[id], k = i + '_' + id, on = !!d.checks[k], off = !!d.skips[k];
      const input = h('input', {
        type: 'checkbox', checked: on, 'data-k': k,
        onchange: (e) => {
          if (e.target.checked) commit({ checks: { [k]: true }, skips: { [k]: DEL } });
          else commit({ checks: { [k]: DEL } });
          renderWeek(); renderOverall(); renderTabs(); renderDay(k);
        }
      });
      const skipInput = h('input', {
        type: 'checkbox', checked: off, 'data-sk': k, 'aria-label': it.title + ' 안 함',
        onchange: (e) => {
          if (e.target.checked) commit({ skips: { [k]: true }, checks: { [k]: DEL } });
          else commit({ skips: { [k]: DEL } });
          renderWeek(); renderOverall(); renderTabs(); renderDay(null, k);
        }
      });
      ul.append(h('li', { class: 'item s-' + s + (on ? ' done' : '') + (off ? ' skipped' : '') },
        h('label', { class: 'check' },
          input, h('span', { class: 'box', 'aria-hidden': 'true' }),
          h('span', { class: 'itext' },
            h('span', { class: 'ititle' }, it.title),
            h('span', { class: 'ihint' }, it.hint))
        ),
        h('div', { class: 'iact' },
          h('label', { class: 'skip' }, skipInput, '안 함'),
          h('button', {
            type: 'button', class: 'ask', 'aria-label': it.title + ' 중 모르는 부분 적기',
            onclick: () => prefill(it.s, it.part)
          }, '모르는 부분 적기'))
      ));
    });
    wrap.append(h('div', { class: 'group s-' + s },
      h('div', { class: 'grouphead' },
        h('span', { class: 'dot', 'aria-hidden': 'true' }),
        h('span', null, SUBJ[s]),
        h('span', { class: 'gc' }, gd + '/' + ids.length)),
      ul));
  });
  const fe = focusKey ? wrap.querySelector('input[data-k="' + focusKey + '"]')
    : focusSkipKey ? wrap.querySelector('input[data-sk="' + focusSkipKey + '"]') : null;
  if (fe) fe.focus({ preventScroll: true });
}

function renderFormMeta() {
  $('nDayHint').textContent = DAYS[state.day] + '요일 기록으로 저장돼요';
  const all = Object.keys(cur().notes);
  const dayN = all.filter((id) => cur().notes[id].day === state.day).length;
  $('fDay').textContent = DAYS[state.day] + '요일 기록 (' + dayN + ')';
  $('fWeek').textContent = (state.week + 1) + '주차 전체 (' + all.length + ')';
  $('fDay').setAttribute('aria-pressed', String(state.filter === 'day'));
  $('fWeek').setAttribute('aria-pressed', String(state.filter === 'week'));
}

function renderNotes() {
  const ul = $('notes');
  ul.textContent = '';
  const notes = cur().notes;
  const list = Object.keys(notes).map((id) => Object.assign({ id }, notes[id]))
    .filter((n) => state.filter === 'week' || n.day === state.day);
  list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!list.length) {
    ul.append(h('li', { class: 'empty' }, state.filter === 'week'
      ? '이 주에는 아직 적은 기록이 없어요.'
      : DAYS[state.day] + '요일에는 아직 적은 기록이 없어요. 공부하다 막히면 위 양식에 적어 보세요.'));
    return;
  }
  list.forEach((n) => {
    const date = addDays(weekStartOf(state.week), n.day);
    const srcs = (n.sources || []).map((s) => h('span', null, s));
    let armed = false, timer = null;
    const del = h('button', {
      type: 'button', class: 'del',
      onclick: () => {
        if (!armed) {
          armed = true; del.classList.add('armed'); del.textContent = '한 번 더 누르면 삭제';
          timer = setTimeout(() => { armed = false; del.classList.remove('armed'); del.textContent = '삭제'; }, 3000);
          return;
        }
        clearTimeout(timer);
        commit({ notes: { [n.id]: DEL } });
        renderOverall(); renderFormMeta(); renderNotes();
      }
    }, '삭제');
    ul.append(h('li', { class: 'note s-' + n.subject + (n.solved ? ' isdone' : '') },
      h('div', { class: 'nhead' },
        h('span', { class: 'ntag' }, (SUBJ[n.subject] || '') + ' · ' + (n.part || '')),
        h('span', { class: 'nwhen' }, DAYS[n.day] + '요일 ' + md(date)),
        srcs.length ? h('span', { class: 'nsrc' }, srcs) : null),
      h('p', { class: 'nq' }, n.question || ''),
      n.query ? h('p', { class: 'nmeta' }, h('b', null, '찾아본 것 '), n.query) : null,
      n.answer ? h('p', { class: 'nmeta' }, h('b', null, '알게 된 내용 '), n.answer) : null,
      h('div', { class: 'nact' },
        h('label', { class: 'solved' },
          h('input', {
            type: 'checkbox', checked: !!n.solved,
            onchange: (e) => { commit({ notes: { [n.id]: { solved: e.target.checked } } }); renderNotes(); }
          }),
          '이해했어요'),
        del)
    ));
  });
}

function renderAll() {
  renderWeek(); renderOverall(); renderTabs(); renderDay(); renderFormMeta(); renderNotes();
}

/* ---------- 기록 양식 ---------- */
function fillParts(subject, part) {
  const sel = $('nPart');
  sel.textContent = '';
  PARTS[subject].forEach((p) => sel.append(h('option', { value: p }, p)));
  if (part && PARTS[subject].indexOf(part) >= 0) sel.value = part;
}
function renderSources() {
  const box = $('nSources');
  box.textContent = '';
  SOURCES.forEach((s) => {
    box.append(h('button', {
      type: 'button', class: 'chip', 'aria-pressed': state.sources[s] ? 'true' : 'false',
      onclick: (e) => {
        state.sources[s] = !state.sources[s];
        e.currentTarget.setAttribute('aria-pressed', String(!!state.sources[s]));
      }
    }, s));
  });
}
function prefill(subject, part) {
  $('nSubject').value = subject;
  fillParts(subject, part);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { $('noteForm').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); } catch (e) {}
  $('nQuestion').focus({ preventScroll: true });
}

function initForm() {
  const sel = $('nSubject');
  ORDER.forEach((s) => sel.append(h('option', { value: s }, SUBJ[s])));
  fillParts(ORDER[0]);
  sel.addEventListener('change', () => fillParts(sel.value));
  renderSources();
  $('noteForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('nQuestion').value.trim();
    if (!q) { $('nMsg').textContent = '모르는 내용을 적어 주세요.'; $('nQuestion').focus(); return; }
    $('nMsg').textContent = '';
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    commit({ notes: { [id]: {
      day: state.day,
      subject: $('nSubject').value,
      part: $('nPart').value,
      sources: SOURCES.filter((s) => state.sources[s]),
      question: q,
      query: $('nQuery').value.trim(),
      answer: $('nAnswer').value.trim(),
      solved: false,
      ts: Date.now()
    } } });
    $('nQuestion').value = ''; $('nQuery').value = ''; $('nAnswer').value = '';
    state.sources = {}; renderSources();
    state.filter = 'day';
    renderOverall(); renderFormMeta(); renderNotes();
  });
  $('nQuestion').addEventListener('input', () => { $('nMsg').textContent = ''; });
  $('fDay').addEventListener('click', () => { state.filter = 'day'; renderFormMeta(); renderNotes(); });
  $('fWeek').addEventListener('click', () => { state.filter = 'week'; renderFormMeta(); renderNotes(); });
}

/* ---------- 주 이동 ---------- */
function goWeek(delta) {
  const n = state.week + delta;
  if (n < 0 || n >= WEEKS) return;
  state.week = n;
  state.day = isTodayWeek() ? todayIdx : 0;
  renderAll();
}
$('prevWeek').addEventListener('click', () => goWeek(-1));
$('nextWeek').addEventListener('click', () => goWeek(1));
$('thisWeek').addEventListener('click', () => {
  state.week = startWeek; state.day = isTodayWeek() ? todayIdx : 0; renderAll();
});

/* ---------- 시작 ---------- */
async function boot() {
  $('period').textContent = ymd(START) + ' – ' + ymd(addDays(START, WEEKS * 7 - 1)) + ' · ' + WEEKS + '주';
  initForm();

  const configured = firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId
    && String(firebaseConfig.apiKey).indexOf('YOUR_') !== 0 && String(firebaseConfig.projectId).indexOf('YOUR_') !== 0;

  if (configured) {
    const key = readKey();
    if (!key) {
      $('app').hidden = true;
      $('gate').hidden = false;
      $('saveStatus').textContent = '';
      return;
    }
    try {
      backend = await makeCloudBackend(key);
    } catch (e) {
      backend = null;
      setStatus('error', 'Firebase를 불러오지 못했어요');
    }
  }
  if (!backend) {
    backend = makeLocalBackend();
    if (configured) {
      $('modeNote').hidden = false;
      $('modeNote').textContent = '인터넷 연결 또는 Firebase 설정에 문제가 있어 이 기기에만 저장 중이에요.';
    } else {
      $('modeNote').hidden = false;
      $('modeNote').textContent = 'Firebase 설정 전이라 이 기기에만 저장돼요. 설정을 마치면 부모님 화면과 연결돼요.';
    }
  }

  let lastJson = '';
  backend.start((all, meta) => {
    const json = JSON.stringify(all);
    const changed = json !== lastJson;
    lastJson = json;
    if (changed) { allWeeks = all; renderAll(); }
    if (backend.mode === 'cloud') setStatus(meta.pending ? 'saving' : (meta.fromCache && !navigator.onLine ? 'offline' : 'cloud'));
    else setStatus('local');
  }, (err) => {
    setStatus('error', err && err.code ? err.code : String(err));
  });
  renderAll();
}
boot();
</script>
