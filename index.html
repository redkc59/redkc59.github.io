<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 학습실</title>
<meta name="description" content="함께 배우는 학습 도구를 모아 둔 공간">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="sun" aria-hidden="true"></div>
    <p class="eyebrow">Welcome</p>
    <h1>우리 반 학습실</h1>
    <p class="lead">따뜻한 차 한 잔처럼, 편하게 들러서 배워 가는 곳이에요.<br>필요한 학습 도구를 골라 바로 사용해 보세요.</p>
  </header>

  <main class="wrap">
    <h2 class="section-title">📂 수업 폴더</h2>
    <div class="grid">
      <a class="folder" href="영어 수업/">
        <span class="tab" aria-hidden="true"></span>
        <span class="icon" aria-hidden="true">📖</span>
        <span class="name">영어 수업</span>
        <span class="desc">문장 성분 분석기 등 영어 공부 도구</span>
        <span class="go">열어 보기 →</span>
      </a>
    </div>

    <section class="note">
      <h2>이렇게 이용해요</h2>
      <ol>
        <li>위의 폴더를 눌러 들어가요.</li>
        <li>사용하고 싶은 도구 카드를 눌러요.</li>
        <li>궁금한 점은 수업 시간에 편하게 물어보세요 🙂</li>
      </ol>
    </section>
  </main>

  <footer>Made with ☕ for my students</footer>
</body>
</html>
